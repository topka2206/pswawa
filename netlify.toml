# Netlify: при каждом изменении в GitHub (в т.ч. из админки) сайт пересобирается
[build]
  command = "pip install -r requirements.txt && python3 _src/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Кэш для статики
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# IndexNow: после деплоя сообщаем Bing (и Copilot / ChatGPT-поиску) об изменённых страницах
[[plugins]]
  package = "./netlify/plugins/indexnow"
  [plugins.inputs]
    key = "d036b764c46054b6578cfd1f8c9e4e32"
    host = "pswawa.pl"
