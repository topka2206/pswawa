<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Элементы фона из брендбука ps.wawa v3.1. Одноцветные: цвет задаётся через currentColor (неон блока или Bone).
       Правила: 1 крупный + 2–3 мелких на экран; крупный обрезан краем; не на тексте, ценах и логотипе. -->
  <defs>
    <filter id="e-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="e-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <symbol id="e-tube" viewBox="0 0 400 300" overflow="visible"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M30 250C10 170 70 110 130 140C190 170 170 250 120 240C70 230 110 120 200 90C290 60 330 120 370 40" stroke="currentColor" stroke-width="34" opacity=".45" filter="url(#e-blur)"/><path d="M30 250C10 170 70 110 130 140C190 170 170 250 120 240C70 230 110 120 200 90C290 60 330 120 370 40" stroke="currentColor" stroke-width="20" filter="url(#e-soft)"/><path d="M30 250C10 170 70 110 130 140C190 170 170 250 120 240C70 230 110 120 200 90C290 60 330 120 370 40" stroke="#fff" stroke-width="5" opacity=".5" transform="translate(-3 -5)" filter="url(#e-soft)"/></g><circle cx="384" cy="22" r="6" fill="currentColor"/></symbol>
    <symbol id="e-donut" viewBox="0 0 60 60" overflow="visible"><circle cx="30" cy="30" r="18" fill="none" stroke="currentColor" stroke-width="22" opacity=".4" filter="url(#e-blur)"/><circle cx="30" cy="30" r="18" fill="none" stroke="currentColor" stroke-width="11"/><path d="M17 22a16 16 0 0 1 14-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/></symbol>
    <symbol id="e-swoosh" viewBox="0 0 400 200" overflow="visible"><path d="M10 150C80 40 180 200 260 110S350 40 372 62" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><path d="M352 50L392 74L360 92Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></symbol>
    <symbol id="e-halo" viewBox="0 0 200 80" overflow="visible"><ellipse cx="100" cy="40" rx="88" ry="24" fill="none" stroke="currentColor" stroke-width="16" opacity=".35" filter="url(#e-blur)"/><ellipse cx="100" cy="40" rx="88" ry="24" fill="none" stroke="currentColor" stroke-width="8"/></symbol>
    <symbol id="e-spark" viewBox="0 0 24 24" overflow="visible"><path d="M12 0C12.8 8.4 15.6 11.2 24 12C15.6 12.8 12.8 15.6 12 24C11.2 15.6 8.4 12.8 0 12C8.4 11.2 11.2 8.4 12 0Z" fill="currentColor"/></symbol>
    <symbol id="e-splat" viewBox="0 0 100 100" overflow="visible"><g fill="currentColor"><circle cx="30" cy="40" r="7"/><circle cx="52" cy="28" r="3.5" opacity=".8"/><circle cx="62" cy="52" r="5" opacity=".9"/><circle cx="44" cy="66" r="2.5" opacity=".7"/><circle cx="78" cy="34" r="2" opacity=".6"/><circle cx="18" cy="70" r="3" opacity=".7"/><circle cx="84" cy="70" r="1.6" opacity=".5"/><circle cx="12" cy="22" r="1.8" opacity=".55"/><circle cx="70" cy="86" r="2.6" opacity=".65"/></g></symbol>
    <symbol id="e-ribbon" viewBox="0 0 400 300" overflow="visible"><g fill="none" stroke-linecap="round"><path d="M-10 220C80 120 160 300 250 180S380 80 410 140" stroke="currentColor" stroke-width="54" opacity=".16"/><path d="M-10 220C80 120 160 300 250 180S380 80 410 140" stroke="currentColor" stroke-width="2" opacity=".85" transform="translate(0 -24)"/><path d="M-10 220C80 120 160 300 250 180S380 80 410 140" stroke="currentColor" stroke-width="1.2" opacity=".5" transform="translate(0 22)"/></g></symbol>
    <symbol id="e-marks" viewBox="0 0 120 60" overflow="visible"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 22h20M22 12v20"/><path d="M58 14l16 16M74 14L58 30"/></g><g fill="currentColor"><circle cx="100" cy="18" r="2"/><circle cx="92" cy="40" r="1.2"/><circle cx="110" cy="46" r="1.6"/><circle cx="36" cy="48" r="1.3"/></g></symbol>
    <symbol id="e-scribble" viewBox="0 0 200 100" overflow="visible"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M70 14C28 16 10 50 40 70C80 94 150 82 158 48C166 16 110 4 52 22"/><path d="M14 92C70 80 130 98 196 84"/></g></symbol>
    <symbol id="e-doodles" viewBox="0 0 330 64" overflow="visible"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 26C10 26 7 30 7 36C7 44 10 50 15 50C19 50 21 46 24 42L40 42C43 46 45 50 49 50C54 50 57 44 57 36C57 30 54 26 50 26Z"/><path d="M16 35h8M20 31v8"/><circle cx="44" cy="33" r="1.8"/><circle cx="49" cy="38" r="1.8"/><g transform="translate(66 0)"><path d="M26 8h12l-2 7h-8z"/><path d="M32 15v13"/><path d="M21 30C21 46 43 46 43 30Z"/><path d="M43 36C54 38 56 50 47 56"/></g><g transform="translate(132 0)"><path d="M36 6L18 36H30L26 58L46 26H34Z"/></g><g transform="translate(198 0)"><circle cx="32" cy="32" r="22"/><path d="M21 24l6 6M27 24l-6 6M37 24l6 6M43 24l-6 6"/><path d="M22 40C28 48 38 48 44 40"/></g><g transform="translate(264 0)"><path d="M6 52C18 32 34 22 56 14"/><path d="M44 8L57 14L51 27"/></g></g></symbol>
    <!-- Дуотон для фото героя: ч/б → фиолетовая растяжка бренда (как на референсе) -->
    <filter id="duo" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues=".10 .62 .88 .99"/><feFuncG type="table" tableValues=".02 .10 .24 .90"/><feFuncB type="table" tableValues=".14 .78 1 1"/></feComponentTransfer></filter>
    <!-- Иконки направлений (свои, не логотипы Sony/Microsoft) -->
    <symbol id="i-gamepad" viewBox="0 0 96 96"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 30H68C80 30 86 38 88 50L91 66C92 74 86 80 79 76L70 68H26L17 76C10 80 4 74 5 66L8 50C10 38 16 30 28 30Z"/><path d="M26 42V54M20 48H32"/><circle cx="39" cy="60" r="4.5"/><circle cx="57" cy="60" r="4.5"/></g><circle cx="66" cy="44" r="3" fill="currentColor"/><circle cx="74" cy="51" r="3" fill="currentColor"/></symbol>
    <symbol id="i-vr" viewBox="0 0 96 96"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 32H72C78.6 32 84 37.4 84 44V56C84 62.6 78.6 68 72 68H60L55 60C52 56 44 56 41 60L36 68H24C17.4 68 12 62.6 12 56V44C12 37.4 17.4 32 24 32Z"/><path d="M12 48H5M84 48H91"/><path d="M24 41H50"/></g><circle cx="66" cy="42" r="2.6" fill="currentColor"/><circle cx="74" cy="42" r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-hookah" viewBox="0 0 96 96"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M38 10H58L55 19H41Z"/><path d="M48 19V34"/><path d="M33 34H63"/><path d="M48 34V50"/><path d="M48 50C31 52 28 66 34 76C38 84 58 84 62 76C68 66 65 52 48 50Z"/><path d="M36 88H60"/><path d="M63 62C79 60 86 70 81 84L86 88"/></g></symbol>
    <!-- Иконки интерфейса -->
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3.6 6.7L4 20l1.2-3.4A7.9 7.9 0 0 1 4 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 13.5l2.5-2.5 2 2 2.5-2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
